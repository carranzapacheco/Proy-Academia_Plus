# ================================================================
# Perfil Vercel
# Se activa desde Dockerfile.vercel con SPRING_PROFILES_ACTIVE=vercel.
# ================================================================

# Los contenedores de Vercel son stateless. Persistimos HttpSession en la
# misma base de datos para que el login siga funcionando aunque cambie la
# instancia que atiende la siguiente petición.
spring.session.jdbc.initialize-schema=${SESSION_SCHEMA_INIT:never}
spring.session.jdbc.schema=classpath:session/schema-mysql.sql
spring.session.jdbc.table-name=SPRING_SESSION

# ================================================================
# OPTIMIZACION DE ARRANQUE EN VERCEL
# ================================================================

spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy

# Vercel termina TLS delante del contenedor.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Pool pequeño: evita agotar las conexiones de bases gratuitas cuando
# Vercel levanta varias instancias del contenedor.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}

# Permite endurecer producción sin cambiar el código. Para la primera
# migración puede mantenerse update; después se recomienda validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# En una demo puede quedar true. Para un uso real se recomienda false.
plustwenty.seed.enabled=${SEED_ENABLED:false}
plustwenty.demo.reset-enabled=${DEMO_RESET_ENABLED:false}
